<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker</title>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/navbar.css">
    <link rel="stylesheet" href="CSS/layout.css">
    <!-- Adding icons from fontawesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="#" class="navbar-brand">Study Tracker</a>
        <button class="navbar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <nav id="nav-links" class="navbar-links" aria-label="Main">
            <a href="#" aria-current="page">Dashboard</a>
            <a href="#">Sessions</a>
            <a href="#">Stats</a>
        </nav>
    </header>    
    <!-- Adding input field to add task -->
    <main>
        <div class="input-container">
            <section class="task-input">
                <input type="text" id="taskInput" placeholder="Enter tasks to lock in.." aria-label="Study task input">
                <button id="addTaskButton" aria-label="Add task">Add Task</button>
            </section>
            <section class="task-list">
                <ul id="taskList" aria-label="List of study tasks"></ul>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
